<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 3 - Contact & Information Form</title>
  <style>
    :root {
      --primary-pink: #f7cad0;
      --deep-pink: #c85376;
      --heading-dark: #6e1635; /* Darker berry for high-contrast visibility */
      --soft-sage: #ccd5ae;
      --deep-sage: #455220; /* Darker forest sage for labels & subheaders */
      --card-bg: rgba(255, 255, 255, 0.94);
      --text-dark: #1b240e;
      --error-color: #b00020;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      /* Background image from your COP folder with an overlay for readability */
      background: linear-gradient(rgba(254, 250, 224, 0.55), rgba(247, 202, 208, 0.55)),
                  url('hello kitty straw.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-dark);
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      max-width: 680px;
      width: 100%;
      padding: 2.5rem;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
      border: 2px solid var(--soft-sage);
    }

    h1 {
      color: var(--heading-dark);
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--deep-sage);
      margin-bottom: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
      color: var(--deep-sage);
    }

    input, select, textarea {
      padding: 0.75rem;
      border: 1.5px solid var(--soft-sage);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #ffffff;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--deep-pink);
      box-shadow: 0 0 0 3px rgba(200, 83, 118, 0.25);
      background-color: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* 6-Character Captcha Box */
    .captcha-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .captcha-badge {
      background: linear-gradient(135deg, #f7cad0, #ccd5ae);
      color: var(--heading-dark);
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 5px;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      user-select: none;
      border: 1px dashed var(--deep-sage);
      display: inline-block;
    }

    .btn-refresh {
      background: none;
      border: none;
      color: var(--deep-sage);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      line-height: 1;
    }

    .btn-refresh:hover {
      color: var(--heading-dark);
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 0.3rem;
      min-height: 1rem;
    }

    .btn-row {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button.action-btn {
      flex: 1;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    button.action-btn:hover {
      transform: translateY(-1px);
    }

    .btn-submit {
      background-color: var(--deep-sage);
      color: #ffffff;
    }

    .btn-submit:hover {
      background-color: #313b14;
    }

    .btn-confirm {
      background-color: var(--deep-pink);
      color: #ffffff;
    }

    .btn-confirm:hover {
      background-color: #a83d5d;
    }

    .btn-secondary {
      background-color: var(--primary-pink);
      color: var(--heading-dark);
    }

    .btn-secondary:hover {
      background-color: #f1b4bd;
    }

    /* Confirmation Card View */
    #confirmation-card {
      display: none;
    }

    .review-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    .review-table th, .review-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e5e5e5;
      text-align: left;
      font-size: 0.95rem;
    }

    .review-table th {
      color: var(--deep-sage);
      width: 35%;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- FORM VIEW -->
    <div id="form-view">
      <h1>Inquiry & Details</h1>
      <p class="subtitle">Please fill out all fields below to verify and submit your information.</p>

      <form id="contactForm" novalidate>
        <div class="form-grid">
          
          <div class="form-group">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" placeholder="First" />
            <span class="error-msg" id="err-firstName"></span>
          </div>

          <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" placeholder="Last" />
            <span class="error-msg" id="err-lastName"></span>
          </div>

          <div class="form-group full-width">
            <label for="streetAddress">Street Address *</label>
            <input type="text" id="streetAddress" placeholder="Street Address" />
            <span class="error-msg" id="err-streetAddress"></span>
          </div>

          <div class="form-group">
            <label for="city">City *</label>
            <input type="text" id="city" placeholder="City" />
            <span class="error-msg" id="err-city"></span>
          </div>

          <div class="form-group">
            <div style="display: flex; gap: 0.5rem;">
              <div style="flex: 1;">
                <label for="state">State *</label>
                <input type="text" id="state" maxlength="2" placeholder="State" style="text-transform: uppercase;" />
              </div>
              <div style="flex: 1.5;">
                <label for="zipCode">Zip Code *</label>
                <input type="text" id="zipCode" maxlength="10" placeholder="Zip Code" />
              </div>
            </div>
            <span class="error-msg" id="err-stateZip"></span>
          </div>

          <div class="form-group">
            <label for="phoneNumber">Phone Number *</label>
            <input type="tel" id="phoneNumber" placeholder="Phone Number" maxlength="14" />
            <span class="error-msg" id="err-phoneNumber"></span>
          </div>

          <div class="form-group">
            <label for="emailAddress">Email Address *</label>
            <input type="email" id="emailAddress" placeholder="Email Address" />
            <span class="error-msg" id="err-emailAddress"></span>
          </div>

          <div class="form-group">
            <label for="birthDate">Birth Date *</label>
            <input type="date" id="birthDate" />
            <span class="error-msg" id="err-birthDate"></span>
          </div>

          <div class="form-group">
            <label>Verify You're Human *</label>
            <div class="captcha-container">
              <span id="captchaCode" class="captcha-badge">------</span>
              <button type="button" class="btn-refresh" id="refreshCaptcha" title="Get new code">&#x21bb;</button>
            </div>
            <input type="text" id="captchaAnswer" placeholder="Enter The Sercuity Code" maxlength="6" />
            <span class="error-msg" id="err-captcha"></span>
          </div>

          <div class="form-group full-width">
            <label for="message">Message *</label>
            <textarea id="message" placeholder="Message"></textarea>
            <span class="error-msg" id="err-message"></span>
          </div>

        </div>

        <div class="btn-row">
          <button type="submit" class="action-btn btn-submit">Review Submission</button>
        </div>
      </form>
    </div>

    <!-- CONFIRMATION VIEW -->
    <div id="confirmation-card">
      <h1>Confirm Your Details</h1>
      <p class="subtitle">Please check that all the entered details are accurate before sending.</p>
      
      <table class="review-table">
        <tbody>
          <tr><th>Full Name</th><td id="rev-name"></td></tr>
          <tr><th>Mailing Address</th><td id="rev-address"></td></tr>
          <tr><th>Phone Number</th><td id="rev-phone"></td></tr>
          <tr><th>Email Address</th><td id="rev-email"></td></tr>
          <tr><th>Birth Date</th><td id="rev-birthdate"></td></tr>
          <tr><th>Message</th><td id="rev-message"></td></tr>
        </tbody>
      </table>

      <div class="btn-row">
        <button type="button" id="btnEdit" class="action-btn btn-secondary">Make Changes</button>
        <button type="button" id="btnFinalSubmit" class="action-btn btn-confirm">Confirm & Send Email</button>
      </div>
    </div>
  </div>

  <script>
    // --- Random 6-Character Captcha Generator (Letters & Digits) ---
    let currentCaptcha = "";
    function generateCaptcha() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      currentCaptcha = result;
      document.getElementById('captchaCode').textContent = currentCaptcha;
    }

    // Initialize captcha & refresh button
    generateCaptcha();
    document.getElementById('refreshCaptcha').addEventListener('click', generateCaptcha);

    // --- Phone Number Input Mask: (000)000-0000 ---
    const phoneInput = document.getElementById('phoneNumber');
    phoneInput.addEventListener('input', function(e) {
      let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
      if (!x[2]) {
        e.target.value = x[1] ? `(${x[1]}` : '';
      } else {
        e.target.value = `(${x[1]})${x[2]}` + (x[3] ? `-${x[3]}` : '');
      }
    });

    // --- Validation Helpers ---
    function setErr(id, msg) {
      document.getElementById(id).textContent = msg;
    }

    function clearErrors() {
      document.querySelectorAll('.error-msg').forEach(el => el.textContent = '');
    }

    // --- Form Submit Handling ---
    const form = document.getElementById('contactForm');
    const formView = document.getElementById('form-view');
    const confirmView = document.getElementById('confirmation-card');

    let formDataPayload = {};

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      clearErrors();
      let isValid = true;

      // First & Last Name
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      if (!firstName) { setErr('err-firstName', 'First name cannot be blank.'); isValid = false; }
      if (!lastName) { setErr('err-lastName', 'Last name cannot be blank.'); isValid = false; }

      // Street Address & City
      const address = document.getElementById('streetAddress').value.trim();
      const city = document.getElementById('city').value.trim();
      if (!address || address.length < 5) {
        setErr('err-streetAddress', 'Please enter a valid street address.');
        isValid = false;
      }
      if (!city) {
        setErr('err-city', 'City cannot be blank.');
        isValid = false;
      }

      // State (2 letters) & Zip Code (5 digits)
      const state = document.getElementById('state').value.trim().toUpperCase();
      const zip = document.getElementById('zipCode').value.trim();
      const stateRegex = /^[A-Z]{2}$/;
      const zipRegex = /^\d{5}(-\d{4})?$/;

      if (!stateRegex.test(state) || !zipRegex.test(zip)) {
        setErr('err-stateZip', 'Enter 2-letter state and valid zip code.');
        isValid = false;
      }

      // Phone Number: (000)000-0000 format
      const phoneVal = phoneInput.value.trim();
      const phoneRegex = /^\(\d{3}\)\d{3}-\d{4}$/;
      if (!phoneRegex.test(phoneVal)) {
        setErr('err-phoneNumber', 'Must be a full 10-digit number: (000)000-0000.');
        isValid = false;
      }

      // Email Address
      const email = document.getElementById('emailAddress').value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        setErr('err-emailAddress', 'Enter a valid email address (name@domain.ext).');
        isValid = false;
      }

      // Birth Date
      const bdateVal = document.getElementById('birthDate').value;
      if (!bdateVal) {
        setErr('err-birthDate', 'Birth date cannot be blank.');
        isValid = false;
      } else {
        const selectedDate = new Date(bdateVal + 'T00:00:00');
        const now = new Date();
        const minDate = new Date();
        minDate.setFullYear(now.getFullYear() - 120);

        if (selectedDate > now) {
          setErr('err-birthDate', 'Warning: Birth date cannot be in the future.');
          isValid = false;
        } else if (selectedDate < minDate) {
          setErr('err-birthDate', 'Warning: Enter a realistic birth date.');
          isValid = false;
        }
      }

      // Verify You're Human (Case-Sensitive 6-Character Captcha)
      const captchaInput = document.getElementById('captchaAnswer').value.trim();
      if (captchaInput !== currentCaptcha) {
        setErr('err-captcha', 'Code does not match. Case-sensitive.');
        isValid = false;
      }

      // Message
      const message = document.getElementById('message').value.trim();
      if (!message) {
        setErr('err-message', 'Message cannot be blank.');
        isValid = false;
      }

      if (isValid) {
        formDataPayload = {
          fullName: `${firstName} ${lastName}`,
          fullAddress: `${address}, ${city}, ${state} ${zip}`,
          phone: phoneVal,
          email: email,
          birthDate: bdateVal,
          message: message
        };

        // Populate Confirmation Card
        document.getElementById('rev-name').textContent = formDataPayload.fullName;
        document.getElementById('rev-address').textContent = formDataPayload.fullAddress;
        document.getElementById('rev-phone').textContent = formDataPayload.phone;
        document.getElementById('rev-email').textContent = formDataPayload.email;
        document.getElementById('rev-birthdate').textContent = formDataPayload.birthDate;
        document.getElementById('rev-message').textContent = formDataPayload.message;

        // Display Review Screen
        formView.style.display = 'none';
        confirmView.style.display = 'block';
      }
    });

    // Make Changes button returns to the editable form
    document.getElementById('btnEdit').addEventListener('click', function() {
      confirmView.style.display = 'none';
      formView.style.display = 'block';
    });

    // Send using mailto:
    document.getElementById('btnFinalSubmit').addEventListener('click', function() {
      const recipientEmail = "YOUR_EMAIL@example.com"; // Be sure to put your email address here
      const subject = encodeURIComponent("Assignment 3 Form Submission - " + formDataPayload.fullName);
      
      const bodyContent = 
        `Name: ${formDataPayload.fullName}\n` +
        `Address: ${formDataPayload.fullAddress}\n` +
        `Phone: ${formDataPayload.phone}\n` +
        `Email: ${formDataPayload.email}\n` +
        `Birth Date: ${formDataPayload.birthDate}\n\n` +
        `Message:\n${formDataPayload.message}`;

      window.location.href = `mailto:${recipientEmail}?subject=${subject}&body=${encodeURIComponent(bodyContent)}`;
    });
  </script>
</body>
</html>
